<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CareerPilot product architecture</title>
  <desc id="desc">Web product dashboard connects to FastAPI services, repositories, PostgreSQL, Redis, Agent Runtime and Browser Platform Adapters.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient>
    <style>text{font-family:Inter,Segoe UI,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#475569}.box{stroke:#cbd5e1;stroke-width:2;rx:18}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="60" y="55" class="title">CareerPilot · Phase 10 Product Architecture</text>
  <rect x="60" y="100" width="250" height="130" class="box" fill="#eef2ff"/>
  <text x="85" y="140" class="label">Next.js Web</text><text x="85" y="170" class="small">Dashboard · Funnel · Trace</text><text x="85" y="194" class="small">Loading / Empty / Error UI</text>
  <rect x="420" y="80" width="330" height="180" class="box" fill="#eff6ff"/>
  <text x="450" y="120" class="label">FastAPI Application</text><text x="450" y="152" class="small">Domain Services · State Machines</text><text x="450" y="176" class="small">Agent Runtime · Analytics</text><text x="450" y="200" class="small">Platform Adapter Registry</text><text x="450" y="224" class="small">Structured errors + retry</text>
  <rect x="860" y="100" width="250" height="130" class="box" fill="#ecfeff"/>
  <text x="885" y="140" class="label">Persistence Layer</text><text x="885" y="170" class="small">SQLAlchemy Repositories</text><text x="885" y="194" class="small">PostgreSQL · pgvector</text>
  <path d="M310 165 H420" class="arrow"/><path d="M750 165 H860" class="arrow"/>
  <rect x="60" y="330" width="250" height="120" class="box" fill="#f0fdf4"/>
  <text x="85" y="370" class="label">Agent Runtime</text><text x="85" y="400" class="small">Planner → Tools → Checkpoints</text><text x="85" y="424" class="small">Trace · token usage · human approval</text>
  <rect x="420" y="310" width="330" height="160" class="box" fill="#f0fdfa"/>
  <text x="450" y="350" class="label">Platform Adapters</text><text x="450" y="382" class="small">Mock Platform · local fixture</text><text x="450" y="406" class="small">CareerBoard prototype</text><text x="450" y="430" class="small">CAPTCHA / LOGIN / RISK / UNKNOWN</text><text x="450" y="454" class="small">pause → REQUEST_USER_ACTION</text>
  <rect x="860" y="330" width="250" height="120" class="box" fill="#fff7ed"/>
  <text x="885" y="370" class="label">Infrastructure</text><text x="885" y="400" class="small">Redis · Worker placeholder</text><text x="885" y="424" class="small">Docker Compose · health checks</text>
  <path d="M185 230 V330" class="arrow"/><path d="M585 260 V310" class="arrow"/><path d="M750 390 H860" class="arrow"/>
</svg>
