services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot}
    ports:
      - "5432:5432"
    volumes:
      - careerpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - careerpilot-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      MATCHING_SEMANTIC_WEIGHT: ${MATCHING_SEMANTIC_WEIGHT:-0.25}
      MATCHING_SKILL_WEIGHT: ${MATCHING_SKILL_WEIGHT:-0.25}
      MATCHING_EDUCATION_WEIGHT: ${MATCHING_EDUCATION_WEIGHT:-0.15}
      MATCHING_EXPERIENCE_WEIGHT: ${MATCHING_EXPERIENCE_WEIGHT:-0.10}
      MATCHING_LOCATION_WEIGHT: ${MATCHING_LOCATION_WEIGHT:-0.10}
      MATCHING_PREFERENCE_WEIGHT: ${MATCHING_PREFERENCE_WEIGHT:-0.10}
      MATCHING_LLM_WEIGHT: ${MATCHING_LLM_WEIGHT:-0.05}
      MATCHING_RETRIEVAL_TOP_K: ${MATCHING_RETRIEVAL_TOP_K:-8}
      MATCHING_RERANK_TOP_K: ${MATCHING_RERANK_TOP_K:-4}
      MATCHING_SCORE_VERSION: ${MATCHING_SCORE_VERSION:-MATCHING_V1}
      RANKING_CANDIDATE_LIMIT: ${RANKING_CANDIDATE_LIMIT:-300}
      TOP_K_EMBEDDING: ${TOP_K_EMBEDDING:-100}
      TOP_K_RERANK: ${TOP_K_RERANK:-30}
      TOP_K_LLM: ${TOP_K_LLM:-15}
      FINAL_RANKING_TOP_K: ${FINAL_RANKING_TOP_K:-10}
      RANKING_VERSION: ${RANKING_VERSION:-RANKING_V1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: ./services/worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  careerpilot-postgres:
  careerpilot-redis:
