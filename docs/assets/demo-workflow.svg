<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CareerPilot demo workflow</title>
  <desc id="desc">Animated workflow from job discovery to approval and safe browser task execution.</desc>
  <style>text{font-family:Inter,Segoe UI,sans-serif;fill:#0f172a}.title{font-size:23px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#475569}.card{stroke:#cbd5e1;stroke-width:2;rx:16}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}</style>
  <rect width="1200" height="300" fill="#f8fafc"/><text x="55" y="48" class="title">CareerPilot · Safe Demo Workflow</text>
  <g class="pulse"><rect x="55" y="95" width="190" height="110" class="card" fill="#eef2ff"/><text x="78" y="133" class="label">1 · Discover</text><text x="78" y="160" class="small">Import normalized JD</text><text x="78" y="181" class="small">Search + deduplicate</text></g>
  <g class="pulse" style="animation-delay:.4s"><rect x="285" y="95" width="190" height="110" class="card" fill="#eff6ff"/><text x="308" y="133" class="label">2 · Rank</text><text x="308" y="160" class="small">RAG evidence</text><text x="308" y="181" class="small">Cost-aware LLM Judge</text></g>
  <g class="pulse" style="animation-delay:.8s"><rect x="515" y="95" width="190" height="110" class="card" fill="#f0fdf4"/><text x="538" y="133" class="label">3 · Approve</text><text x="538" y="160" class="small">Human selects jobs</text><text x="538" y="181" class="small">Queue Application</text></g>
  <g class="pulse" style="animation-delay:1.2s"><rect x="745" y="95" width="190" height="110" class="card" fill="#f0fdfa"/><text x="768" y="133" class="label">4 · Browser Task</text><text x="768" y="160" class="small">User browser session</text><text x="768" y="181" class="small">Adapter actions + Trace</text></g>
  <g class="pulse" style="animation-delay:1.6s"><rect x="975" y="95" width="170" height="110" class="card" fill="#fff7ed"/><text x="998" y="133" class="label">5 · Pause</text><text x="998" y="160" class="small">Risk / CAPTCHA</text><text x="998" y="181" class="small">Resume safely</text></g>
  <path d="M245 150 H285 M475 150 H515 M705 150 H745 M935 150 H975" stroke="#64748b" stroke-width="3"/>
</svg>
