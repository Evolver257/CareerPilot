[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-api"
version = "0.1.0"
description = "CareerPilot application API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=43,<47",
  "httpx>=0.28,<1",
  "llama-index-core>=0.14.24,<0.15",
  "mcp>=2.1,<3",
  "pgvector>=0.3,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.0,<7",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "python-docx>=1.1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "reportlab>=4.0,<5",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
