services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot}
    ports:
      - "5432:5432"
    volumes:
      - careerpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - careerpilot-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
      args: &semantic-build-args
        INSTALL_SEMANTIC: ${INSTALL_SEMANTIC:-true}
    environment: &api-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      INDEPENDENT_WORKER: "true"
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      SEMANTIC_CACHE_DIR: /models
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      LLM_STRUCTURED_MAX_TOKENS: ${LLM_STRUCTURED_MAX_TOKENS:-8192}
      LLM_STRUCTURED_RETRY_MAX_TOKENS: ${LLM_STRUCTURED_RETRY_MAX_TOKENS:-12288}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-development-only-change-me}
      MATCHING_SEMANTIC_WEIGHT: ${MATCHING_SEMANTIC_WEIGHT:-0.25}
      MATCHING_SKILL_WEIGHT: ${MATCHING_SKILL_WEIGHT:-0.25}
      MATCHING_EDUCATION_WEIGHT: ${MATCHING_EDUCATION_WEIGHT:-0.15}
      MATCHING_EXPERIENCE_WEIGHT: ${MATCHING_EXPERIENCE_WEIGHT:-0.10}
      MATCHING_LOCATION_WEIGHT: ${MATCHING_LOCATION_WEIGHT:-0.10}
      MATCHING_PREFERENCE_WEIGHT: ${MATCHING_PREFERENCE_WEIGHT:-0.10}
      MATCHING_LLM_WEIGHT: ${MATCHING_LLM_WEIGHT:-0.05}
      MATCHING_RETRIEVAL_TOP_K: ${MATCHING_RETRIEVAL_TOP_K:-8}
      MATCHING_RERANK_TOP_K: ${MATCHING_RERANK_TOP_K:-4}
      MATCHING_SCORE_VERSION: ${MATCHING_SCORE_VERSION:-MATCHING_V1}
      RANKING_CANDIDATE_LIMIT: ${RANKING_CANDIDATE_LIMIT:-300}
      TOP_K_EMBEDDING: ${TOP_K_EMBEDDING:-100}
      TOP_K_RERANK: ${TOP_K_RERANK:-10}
      TOP_K_LLM: ${TOP_K_LLM:-10}
      FINAL_RANKING_TOP_K: ${FINAL_RANKING_TOP_K:-10}
      RANKING_VERSION: ${RANKING_VERSION:-RANKING_V1}
      RANKING_TIMEOUT_SECONDS: ${RANKING_TIMEOUT_SECONDS:-1800}
      AUTO_DELIVERY_MAX_JOB_AGE_DAYS: ${AUTO_DELIVERY_MAX_JOB_AGE_DAYS:-3}
      RAG_EVIDENCE_MIN_RELEVANCE: ${RAG_EVIDENCE_MIN_RELEVANCE:-0.42}
      RAG_RERANKER: ${RAG_RERANKER:-local}
      SEMANTIC_RERANKER_MODEL: ${SEMANTIC_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./outputs/model-cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ./services/api
      args:
        <<: *semantic-build-args
    cpus: ${WORKER_CPUS:-2.0}
    environment:
      <<: *api-environment
      OMP_NUM_THREADS: ${WORKER_OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${WORKER_OPENBLAS_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${WORKER_MKL_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./outputs/model-cache:/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8010}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
        NEXT_PUBLIC_BUILD_TIME: ${NEXT_PUBLIC_BUILD_TIME:-unknown}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8010}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
      NEXT_PUBLIC_BUILD_TIME: ${NEXT_PUBLIC_BUILD_TIME:-unknown}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  careerpilot-postgres:
  careerpilot-redis:
